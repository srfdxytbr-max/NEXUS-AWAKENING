<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NEXUS-AWAKENING</title>


<!-- =========================
     FONTE
========================= -->

<link
    href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&display=swap"
    rel="stylesheet"
>


<style>

/* =========================
   RESET
========================= */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;

    height: 100%;

    overflow: hidden;

}


/* =========================
   CORPO / FUNDO
========================= */

body {

    font-family: Georgia, serif;

    color: white;

    background:

        linear-gradient(
            rgba(20, 5, 35, 0.45),
            rgba(0, 0, 0, 0.92)
        ),

        url("https://i.pinimg.com/originals/a3/9b/66/a39b666e8432df8033c05559e61569b7.gif");

    background-size: cover;

    background-position: center;

    background-repeat: no-repeat;

    display: flex;

    justify-content: center;

    align-items: center;

}


/* =========================
   SOMBRA CINEMATOGRÁFICA
========================= */

body::after {

    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    z-index: 2;

    background:

        linear-gradient(
            to bottom,
            transparent 40%,
            rgba(0, 0, 0, 0.15) 55%,
            rgba(0, 0, 0, 0.95) 100%
        );

}


/* =========================
   CONTEÚDO
========================= */

.conteudo {

    position: relative;

    z-index: 3;

    width: 90%;

    max-width: 900px;

    text-align: center;

    padding: 40px;

}


/* =========================
   ANIMAÇÕES
========================= */

@keyframes aparecerTitulo {

    from {

        opacity: 0;

        transform:
            translateY(35px)
            scale(0.92);

        filter: blur(8px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

        filter: blur(0);

    }

}


@keyframes aparecer {

    from {

        opacity: 0;

        transform: translateY(20px);

        filter: blur(4px);

    }

    to {

        opacity: 1;

        transform: translateY(0);

        filter: blur(0);

    }

}


@keyframes linha {

    from {

        width: 0;

        opacity: 0;

    }

    to {

        width: 130px;

        opacity: 1;

    }

}


/* =========================
   NEXUS
========================= */

.titulo {

    margin: 0;

    font-family:
        "Cinzel Decorative",
        serif;

    font-weight: 700;

    font-size:
        clamp(45px, 10vw, 95px);

    letter-spacing: 10px;

    opacity: 0;

    animation:

        aparecerTitulo
        1.3s
        cubic-bezier(.2, .8, .2, 1)
        forwards;

    text-shadow:

        0 0 10px #a855f7,

        0 0 25px #7e22ce,

        0 0 55px #581c87;

}


/* =========================
   AWAKENING
========================= */

.subtitulo {

    margin-top: 10px;

    font-family:
        "Cinzel Decorative",
        serif;

    font-size: 18px;

    letter-spacing: 6px;

    color: #d8b4fe;

    opacity: 0;

    animation:

        aparecer
        1s
        ease
        0.7s
        forwards;

}


/* =========================
   LINHA
========================= */

.linha {

    height: 2px;

    margin: 30px auto;

    background: #a855f7;

    box-shadow:

        0 0 10px #a855f7,

        0 0 25px #7e22ce;

    opacity: 0;

    animation:

        linha
        1s
        ease
        1.1s
        forwards;

}


/* =========================
   FRASE
========================= */

.descricao {

    color: #ddd6fe;

    font-size: 17px;

    line-height: 1.7;

    opacity: 0;

    animation:

        aparecer
        1s
        ease
        1.5s
        forwards;

}


/* =========================
   BOTÕES
========================= */

.botoes {

    display: flex;

    justify-content: center;

    gap: 20px;

    flex-wrap: wrap;

    margin-top: 45px;

    opacity: 0;

    animation:

        aparecer
        1s
        ease
        1.8s
        forwards;

}


.botao {

    min-width: 230px;

    padding: 18px 25px;

    border: 1px solid #a855f7;

    border-radius: 8px;

    background:
        rgba(25, 5, 40, 0.65);

    color: white;

    text-decoration: none;

    font-size: 16px;

    box-shadow:

        0 0 15px
        rgba(168, 85, 247, 0.25);

    transition: 0.3s;

}


.botao:hover {

    transform:
        translateY(-5px);

    background:
        rgba(126, 34, 206, 0.5);

    box-shadow:

        0 0 30px
        rgba(168, 85, 247, 0.7);

}


/* =========================
   MÚSICA
========================= */

.musica {

    margin-top: 35px;

    opacity: 0;

    animation:

        aparecer
        1s
        ease
        2.1s
        forwards;

}


.musica button {

    border: 1px solid #8b5cf6;

    border-radius: 25px;

    padding: 12px 24px;

    color: #ede9fe;

    background:
        rgba(10, 3, 18, 0.75);

    cursor: pointer;

    font-size: 15px;

    font-family: Georgia, serif;

    transition: 0.3s;

}


.musica button:hover {

    background:
        rgba(91, 33, 182, 0.6);

    box-shadow:

        0 0 20px
        rgba(139, 92, 246, 0.5);

}


/* =========================
   RODAPÉ
========================= */

.rodape {

    margin-top: 35px;

    font-size: 12px;

    color: #8b8199;

    opacity: 0;

    animation:

        aparecer
        1s
        ease
        2.3s
        forwards;

}


/* =========================
   PLAYER INVISÍVEL
========================= */

#audio {

    display: none;

}


/* =========================
   CELULAR
========================= */

@media (max-width: 600px) {

    .conteudo {

        padding: 25px;

    }


    .titulo {

        letter-spacing: 5px;

        font-size:
            clamp(45px, 15vw, 75px);

    }


    .subtitulo {

        font-size: 13px;

        letter-spacing: 4px;

    }


    .descricao {

        font-size: 15px;

    }


    .botao {

        width: 100%;

    }

}

</style>

</head>


<body>


<main class="conteudo">


    <!-- =========================
         TÍTULO
    ========================== -->

    <h1 class="titulo">

        NEXUS

    </h1>


    <div class="subtitulo">

        AWAKENING

    </div>


    <div class="linha"></div>


    <!-- =========================
         FRASE
    ========================== -->

    <p class="descricao">

        “Nem toda sombra esconde algo.
        Algumas apenas revelam o que a luz não mostra.”

    </p>


    <!-- =========================
         BOTÕES
    ========================== -->

    <div class="botoes">


        <!-- LIVRO -->

        <a
            href="livro.html"
            class="botao"
        >

            📖
            <br>

            Livro do RPG

        </a>


        <!-- FICHA -->

        <a
            href="ficha.html"
            class="botao"
        >

            📝
            <br>

            Ficha do Personagem

        </a>


    </div>


    <!-- =========================
         BOTÃO DE MÚSICA
    ========================== -->

    <div class="musica">

        <button
            id="botao-musica"
            onclick="alternarMusica()"
        >

            🎸 Tocar música

        </button>

    </div>


    <!-- =========================
         RODAPÉ
    ========================== -->

    <div class="rodape">

        NEXUS-AWAKENING • RPG

    </div>


</main>


<!-- =========================
     MÚSICA
     
     O ARQUIVO PRECISA ESTAR
     NA MESMA PASTA DO INDEX.HTML
========================== -->

<audio
    id="audio"
    src="Dark Acoustic Guitar Instrumental Beat 2018 Betrayed - Ryini Beats (youtube).mp3"
    loop
    preload="auto"
></audio>


<script>


/* =========================
   CONTROLE DA MÚSICA
========================= */

const audio =
    document.getElementById("audio");


const botao =
    document.getElementById("botao-musica");


let tocando = false;


function alternarMusica() {


    if (!tocando) {


        audio.volume = 0.45;


        audio.play()

        .then(function () {


            tocando = true;


            botao.innerHTML =
                "🔊 Música ligada";


        })


        .catch(function () {


            alert(

                "Não foi possível iniciar a música. " +

                "Verifique se o arquivo MP3 está " +

                "na mesma pasta do index.html."

            );

        });


    }


    else {


        audio.pause();


        tocando = false;


        botao.innerHTML =
            "🎸 Tocar música";


    }

}

</script>


</body>

</html>
