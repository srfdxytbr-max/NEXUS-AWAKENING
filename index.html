<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXUS-AWAKENING</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      text-align: center;
    }

    header {
      padding: 40px 20px;
      background: linear-gradient(135deg, #111827, #1e1b4b);
    }

    h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    p {
      color: #b8b8c7;
      font-size: 18px;
    }

    .botao {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 25px;
      background: #5865f2;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
    }

    .conteudo {
      padding: 40px 20px;
    }

    .card {
      max-width: 500px;
      margin: 20px auto;
      padding: 25px;
      background: #15151d;
      border: 1px solid #292936;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <header>
    <h1>NEXUS-AWAKENING</h1>
    <p>O início da sua jornada.</p>

    <a href="#" class="botao">Criar Ficha</a>
  </header>

  <div class="conteudo">

    <div class="card">
      <h2>Bem-vindo ao Nexus</h2>
      <p>
        Crie, edite e gerencie sua ficha diretamente pelo site.
      </p>
    </div>

    <div class="card">
      <h2>⚔️ Sistema de Fichas</h2>
      <p>
        Em breve você poderá criar sua ficha e salvar seus dados.
      </p>
    </div>

  </div>

</body>
</html>
