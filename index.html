<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXUS-AWAKENING</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {

      font-family: Georgia, serif;

      color: white;

      background:
        linear-gradient(
          rgba(20, 5, 35, 0.45),
          rgba(0, 0, 0, 0.92)
        ),
        url("https://i.pinimg.com/originals/a3/9b/66/a39b666e8432df8033c05559e61569b7.gif");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      justify-content: center;
      align-items: center;
    }


    /* =========================
       SOMBRA INFERIOR
    ========================= */

    body::after {

      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      z-index: 2;

      background:
        linear-gradient(
          to bottom,
          transparent 40%,
          rgba(0, 0, 0, 0.15) 55%,
          rgba(0, 0, 0, 0.95) 100%
        );
    }


    /* =========================
       CONTEÚDO
    ========================= */

    .conteudo {

      position: relative;

      z-index: 3;

      width: 90%;

      max-width: 900px;

      text-align: center;

      padding: 40px;
    }


    /* =========================
       NEXUS
    ========================= */

    .titulo {

      margin: 0;

      font-size:
        clamp(45px, 10vw, 95px);

      letter-spacing: 10px;

      text-shadow:
        0 0 10px #a855f7,
        0 0 25px #7e22ce,
        0 0 55px #581c87;
    }


    .titulo span {

      display: inline-block;

      opacity: 0;

      transform:
        translateY(35px)
        scale(0.85);

      filter: blur(12px);

      animation:
        surgirLetra 1.1s
        cubic-bezier(0.22, 1, 0.36, 1)
        forwards;
    }


    .titulo span:nth-child(1) {
      animation-delay: 0.25s;
    }

    .titulo span:nth-child(2) {
      animation-delay: 0.40s;
    }

    .titulo span:nth-child(3) {
      animation-delay: 0.55s;
    }

    .titulo span:nth-child(4) {
      animation-delay: 0.70s;
    }

    .titulo span:nth-child(5) {
      animation-delay: 0.85s;
    }


    @keyframes surgirLetra {

      0% {

        opacity: 0;

        transform:
          translateY(35px)
          scale(0.85);

        filter: blur(12px);
      }

      60% {

        opacity: 1;

        filter: blur(2px);
      }

      100% {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

        filter: blur(0);
      }
    }


    /* =========================
       AWAKENING
    ========================= */

    .subtitulo {

      margin-top: 10px;

      font-size: 18px;

      letter-spacing: 6px;

      color: #d8b4fe;

      opacity: 0;

      transform:
        translateY(20px);

      animation:
        aparecer 1.4s ease forwards;

      animation-delay: 1.25s;
    }


    /* =========================
       LINHA
    ========================= */

    .linha {

      width: 0;

      height: 2px;

      margin: 30px auto;

      background: #a855f7;

      box-shadow:
        0 0 10px #a855f7,
        0 0 25px #7e22ce;

      animation:
        crescerLinha 1.2s ease forwards;

      animation-delay: 1.65s;
    }


    @keyframes crescerLinha {

      from {

        width: 0;

        opacity: 0;
      }

      to {

        width: 130px;

        opacity: 1;
      }
    }


    /* =========================
       FRASE
    ========================= */

    .descricao {

      color: #ddd6fe;

      font-size: 17px;

      line-height: 1.7;

      max-width: 650px;

      margin: 0 auto;

      opacity: 0;

      transform:
        translateY(20px);

      filter: blur(5px);

      animation:
        aparecerFrase 1.5s ease forwards;

      animation-delay: 1.9s;
    }


    @keyframes aparecerFrase {

      from {

        opacity: 0;

        transform:
          translateY(20px);

        filter: blur(5px);
      }

      to {

        opacity: 1;

        transform:
          translateY(0);

        filter: blur(0);
      }
    }


    /* =========================
       BOTÕES
    ========================= */

    .botoes {

      display: flex;

      justify-content: center;

      gap: 20px;

      flex-wrap: wrap;

      margin-top: 45px;

      opacity: 0;

      transform:
        translateY(25px);

      animation:
        aparecer 1.3s ease forwards;

      animation-delay: 2.7s;
    }


    .botao {

      min-width: 230px;

      padding: 18px 25px;

      border:
        1px solid #a855f7;

      border-radius: 8px;

      background:
        rgba(25, 5, 40, 0.65);

      color: white;

      text-decoration: none;

      font-size: 16px;

      box-shadow:
        0 0 15px
        rgba(168, 85, 247, 0.25);

      transition: 0.3s;
    }


    .botao:hover {

      transform:
        translateY(-5px);

      background:
        rgba(126, 34, 206, 0.5);

      box-shadow:
        0 0 30px
        rgba(168, 85, 247, 0.7);
    }


    /* =========================
       MÚSICA
    ========================= */

    .musica {

      margin-top: 35px;

      opacity: 0;

      transform:
        translateY(20px);

      animation:
        aparecer 1.2s ease forwards;

      animation-delay: 3.1s;
    }


    .musica button {

      border:
        1px solid #8b5cf6;

      border-radius: 25px;

      padding: 12px 24px;

      color: #ede9fe;

      background:
        rgba(10, 3, 18, 0.75);

      cursor: pointer;

      font-size: 15px;

      transition: 0.3s;
    }


    .musica button:hover {

      background:
        rgba(91, 33, 182, 0.6);

      box-shadow:
        0 0 20px
        rgba(139, 92, 246, 0.5);
    }


    /* =========================
       PLAYER YOUTUBE
       
       IMPORTANTE:
       Não usamos display:none.
       Não usamos visibility:hidden.
       
       O player continua existindo,
       mas está fora da área visível.
    ========================= */

    #youtube-player {

      position: fixed;

      width: 200px;

      height: 200px;

      left: -300px;

      top: -300px;

      opacity: 0;

      pointer-events: none;

      border: 0;
    }


    /* =========================
       RODAPÉ
    ========================= */

    .rodape {

      margin-top: 35px;

      font-size: 12px;

      color: #8b8199;

      opacity: 0;

      animation:
        aparecer 1s ease forwards;

      animation-delay: 3.4s;
    }


    @keyframes aparecer {

      from {

        opacity: 0;

        transform:
          translateY(20px);
      }

      to {

        opacity: 1;

        transform:
          translateY(0);
      }
    }


    /* =========================
       CELULAR
    ========================= */

    @media (max-width: 600px) {

      .conteudo {

        padding: 25px;
      }

      .titulo {

        letter-spacing: 5px;
      }

      .subtitulo {

        font-size: 14px;

        letter-spacing: 4px;
      }

      .descricao {

        font-size: 15px;
      }

      .botao {

        width: 100%;

        min-width: unset;
      }
    }

  </style>

</head>


<body>


  <main class="conteudo">


    <h1 class="titulo">

      <span>N</span>
      <span>E</span>
      <span>X</span>
      <span>U</span>
      <span>S</span>

    </h1>


    <div class="subtitulo">

      AWAKENING

    </div>


    <div class="linha"></div>


    <p class="descricao">

      <em>

        “Nem toda sombra esconde algo.
        Algumas apenas revelam o que a luz não mostra.”

      </em>

    </p>


    <div class="botoes">


      <a
        href="livro.html"
        class="botao"
      >

        📖<br>

        Livro do RPG

      </a>


      <a
        href="ficha.html"
        class="botao"
      >

        📝<br>

        Ficha do Personagem

      </a>


    </div>


    <div class="musica">


      <button
        id="botao-musica"
        onclick="alternarMusica()"
      >

        🎸 Tocar música

      </button>


    </div>


    <div class="rodape">

      NEXUS-AWAKENING • RPG

    </div>


  </main>


  <!-- PLAYER INVISÍVEL -->

  <div id="youtube-player"></div>


  <script>


    let player = null;

    let playerPronto = false;

    let tocando = false;


    /*
      CARREGA A API
    */

    const tag =
      document.createElement("script");


    tag.src =
      "https://www.youtube.com/iframe_api";


    document.head.appendChild(tag);


    /*
      QUANDO A API TERMINAR
      DE CARREGAR
    */

    function onYouTubeIframeAPIReady() {


      player =
        new YT.Player(
          "youtube-player",
          {

            width: "200",

            height: "200",

            videoId:
              "NLaMyAbKNYo",


            playerVars: {

              /*
                ESSENCIAL PARA A API
              */

              enablejsapi: 1,

              /*
                IDENTIFICA O SITE
              */

              origin:
                window.location.origin,

              /*
                Reprodução dentro da página
              */

              playsinline: 1,

              /*
                Sem controles
              */

              controls: 0,

              /*
                Não mostrar vídeos
                relacionados de outros canais
              */

              rel: 0

            },


            events: {


              onReady:
                function(event) {


                  playerPronto = true;


                  event.target.setVolume(45);


                  console.log(
                    "YouTube pronto."
                  );

                },


              onStateChange:
                function(event) {


                  console.log(
                    "Estado do YouTube:",
                    event.data
                  );


                  /*
                    1 = tocando
                  */

                  if (
                    event.data ===
                    YT.PlayerState.PLAYING
                  ) {


                    tocando = true;


                    document
                      .getElementById(
                        "botao-musica"
                      )
                      .innerHTML =
                      "🔊 Música ligada";

                  }


                  /*
                    2 = pausado
                  */

                  if (
                    event.data ===
                    YT.PlayerState.PAUSED
                  ) {


                    tocando = false;


                    document
                      .getElementById(
                        "botao-musica"
                      )
                      .innerHTML =
                      "🎸 Tocar música";

                  }


                  /*
                    0 = terminou
                  */

                  if (
                    event.data ===
                    YT.PlayerState.ENDED
                  ) {


                    tocando = false;


                    document
                      .getElementById(
                        "botao-musica"
                      )
                      .innerHTML =
                      "🎸 Tocar música";

                  }

                },


              onError:
                function(event) {


                  console.log(
                    "ERRO DO YOUTUBE:",
                    event.data
                  );


                  /*
                    2  = parâmetro inválido
                    5  = erro HTML5
                    100 = vídeo não encontrado
                    101 = incorporação não permitida
                    150 = incorporação não permitida
                  */


                  if (
                    event.data === 101 ||
                    event.data === 150
                  ) {

                    console.log(
                      "Este vídeo não permite incorporação."
                    );

                  }


                  tocando = false;

                }

            }

          }
        );

    }


    /*
      BOTÃO
    */

    function alternarMusica() {


      const botao =
        document.getElementById(
          "botao-musica"
        );


      /*
        A API ainda não terminou
        de carregar
      */

      if (
        !player ||
        !playerPronto
      ) {


        botao.innerHTML =
          "⏳ Carregando...";


        setTimeout(
          function() {

            if (!tocando) {

              botao.innerHTML =
                "🎸 Tocar música";

            }

          },
          1500
        );


        return;

      }


      /*
        TOCAR
    */

      if (!tocando) {


        player.setVolume(45);


        /*
          O clique do usuário
          chama diretamente
          playVideo()
        */

        player.playVideo();


      }


      /*
        PAUSAR
      */

      else {


        player.pauseVideo();

      }

    }


  </script>


</body>
</html>
