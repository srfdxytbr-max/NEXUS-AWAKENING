<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEXUS-AWAKENING</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: Georgia, serif;
      color: white;

      background:
        linear-gradient(
          rgba(20, 5, 35, 0.45),
          rgba(0, 0, 0, 0.92)
        ),
        url("https://i.pinimg.com/originals/a3/9b/66/a39b666e8432df8033c05559e61569b7.gif");

      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Sombra cinematográfica na parte inferior */
    body::after {
      content: "";
      position: fixed;
      inset: 0;

      pointer-events: none;
      z-index: 2;

      background: linear-gradient(
        to bottom,
        transparent 40%,
        rgba(0, 0, 0, 0.15) 55%,
        rgba(0, 0, 0, 0.95) 100%
      );
    }

    .conteudo {
      position: relative;
      z-index: 3;

      width: 90%;
      max-width: 900px;

      text-align: center;
      padding: 40px;
    }

    .titulo {
      margin: 0;

      font-size: clamp(45px, 10vw, 95px);
      letter-spacing: 10px;

      text-shadow:
        0 0 10px #a855f7,
        0 0 25px #7e22ce,
        0 0 55px #581c87;
    }

    .subtitulo {
      margin-top: 10px;

      font-size: 18px;
      letter-spacing: 6px;

      color: #d8b4fe;
    }

    .linha {
      width: 130px;
      height: 2px;

      margin: 30px auto;

      background: #a855f7;

      box-shadow:
        0 0 10px #a855f7,
        0 0 25px #7e22ce;
    }

    .descricao {
      color: #ddd6fe;
      font-size: 17px;
    }

    .botoes {
      display: flex;
      justify-content: center;
      gap: 20px;

      flex-wrap: wrap;

      margin-top: 45px;
    }

    .botao {
      min-width: 230px;

      padding: 18px 25px;

      border: 1px solid #a855f7;
      border-radius: 8px;

      background: rgba(25, 5, 40, 0.65);

      color: white;
      text-decoration: none;

      font-size: 16px;

      box-shadow:
        0 0 15px rgba(168, 85, 247, 0.25);

      transition: 0.3s;
    }

    .botao:hover {
      transform: translateY(-5px);

      background: rgba(126, 34, 206, 0.5);

      box-shadow:
        0 0 30px rgba(168, 85, 247, 0.7);
    }

    .musica {
      margin-top: 35px;
    }

    .musica button {
      border: 1px solid #8b5cf6;
      border-radius: 25px;

      padding: 12px 24px;

      color: #ede9fe;
      background: rgba(10, 3, 18, 0.75);

      cursor: pointer;

      font-size: 15px;

      transition: 0.3s;
    }

    .musica button:hover {
      background: rgba(91, 33, 182, 0.6);

      box-shadow:
        0 0 20px rgba(139, 92, 246, 0.5);
    }

    .rodape {
      margin-top: 35px;

      font-size: 12px;
      color: #8b8199;
    }

    /* Player do YouTube */
    #youtube-player {
      position: fixed;

      width: 1px;
      height: 1px;

      opacity: 0;
      pointer-events: none;

      left: -10px;
      bottom: -10px;
    }
  </style>
</head>

<body>

  <main class="conteudo">

    <h1 class="titulo">NEXUS</h1>

    <div class="subtitulo">
      AWAKENING
    </div>

    <div class="linha"></div>

    <p class="descricao">
      “Nem toda sombra esconde algo. Algumas apenas revelam o que a luz não mostra.”
    </p>

    <div class="botoes">

      <a href="livro.html" class="botao">
        📖<br>
        Livro do RPG
      </a>

      <a href="ficha.html" class="botao">
        📝<br>
        Ficha do Personagem
      </a>

    </div>

    <div class="musica">

      <button id="botao-musica" onclick="alternarMusica()">
        🎸 Tocar música
      </button>

    </div>

    <div class="rodape">
      NEXUS-AWAKENING • RPG
    </div>

  </main>


  <!-- Player invisível do YouTube -->
  <div id="youtube-player"></div>


  <script>

    let player;
    let tocando = false;

    /*
      Carrega a API do YouTube
    */

    const tag = document.createElement("script");

    tag.src = "https://www.youtube.com/iframe_api";

    document.head.appendChild(tag);


    /*
      Cria o player.
      
      ID da música:
      NLaMyAbKNYo
    */

    function onYouTubeIframeAPIReady() {

      player = new YT.Player("youtube-player", {

        height: "1",
        width: "1",

        videoId: "NLaMyAbKNYo",

        playerVars: {
          playsinline: 1,
          controls: 0
        }

      });

    }


    /*
      Botão de música
    */

    function alternarMusica() {

      if (!player) {

        alert(
          "A música ainda está carregando. Tente novamente em alguns segundos."
        );

        return;
      }


      const botao =
        document.getElementById("botao-musica");


      if (!tocando) {

        player.setVolume(45);

        player.playVideo();

        tocando = true;

        botao.innerHTML = "🔊 Música ligada";

      } else {

        player.pauseVideo();

        tocando = false;

        botao.innerHTML = "🎸 Tocar música";

      }

    }

  </script>

</body>
</html>
