<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NEXUS-AWAKENING</title>


<!-- =====================================================
     FONTE DO TÍTULO
===================================================== -->

<link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
}


html,
body{

    margin:0;

    width:100%;

    min-height:100%;

}


/* =====================================================
   BODY
===================================================== */

body{

    min-height:100vh;

    overflow:hidden;

    color:white;

    font-family:Georgia, serif;

    background:

        linear-gradient(
            rgba(20,5,35,.45),
            rgba(0,0,0,.92)
        ),

        url("https://i.pinimg.com/originals/a3/9b/66/a39b666e8432df8033c05559e61569b7.gif");

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;

    display:flex;

    justify-content:center;

    align-items:center;

}


/* =====================================================
   SOMBRA CINEMATOGRÁFICA
===================================================== */

body::after{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:2;

    background:

        linear-gradient(
            to bottom,
            transparent 40%,
            rgba(0,0,0,.15) 55%,
            rgba(0,0,0,.95) 100%
        );

}


/* =====================================================
   CONTEÚDO
===================================================== */

.conteudo{

    position:relative;

    z-index:3;

    width:90%;

    max-width:900px;

    text-align:center;

    padding:40px;

}


/* =====================================================
   ANIMAÇÕES
===================================================== */

@keyframes aparecerTitulo{

    0%{

        opacity:0;

        transform:
            translateY(35px)
            scale(.94);

        filter:blur(8px);

    }

    100%{

        opacity:1;

        transform:
            translateY(0)
            scale(1);

        filter:blur(0);

    }

}


@keyframes aparecerSubtitulo{

    0%{

        opacity:0;

        transform:translateY(20px);

    }

    100%{

        opacity:1;

        transform:translateY(0);

    }

}


@keyframes aparecerLinha{

    0%{

        opacity:0;

        width:0;

    }

    100%{

        opacity:1;

        width:130px;

    }

}


@keyframes aparecerDescricao{

    0%{

        opacity:0;

        transform:translateY(15px);

    }

    100%{

        opacity:1;

        transform:translateY(0);

    }

}


@keyframes aparecerBotoes{

    0%{

        opacity:0;

        transform:
            translateY(25px);

    }

    100%{

        opacity:1;

        transform:
            translateY(0);

    }

}


/* =====================================================
   NEXUS
===================================================== */

.titulo{

    margin:0;

    font-family:"Cinzel", Georgia, serif;

    font-size:
        clamp(45px,10vw,95px);

    font-weight:700;

    letter-spacing:10px;

    opacity:0;

    animation:
        aparecerTitulo
        1.2s
        cubic-bezier(.22,1,.36,1)
        .2s
        forwards;

    text-shadow:

        0 0 10px #a855f7,

        0 0 25px #7e22ce,

        0 0 55px #581c87;

}


/* =====================================================
   AWAKENING
===================================================== */

.subtitulo{

    margin-top:10px;

    font-size:18px;

    letter-spacing:6px;

    color:#d8b4fe;

    opacity:0;

    animation:
        aparecerSubtitulo
        .9s
        ease
        1s
        forwards;

}


/* =====================================================
   LINHA
===================================================== */

.linha{

    height:2px;

    margin:30px auto;

    background:#a855f7;

    box-shadow:

        0 0 10px #a855f7,

        0 0 25px #7e22ce;

    opacity:0;

    animation:
        aparecerLinha
        .8s
        ease
        1.5s
        forwards;

}


/* =====================================================
   FRASE
===================================================== */

.descricao{

    max-width:700px;

    margin:0 auto;

    color:#ddd6fe;

    font-size:17px;

    line-height:1.7;

    font-style:italic;

    opacity:0;

    animation:
        aparecerDescricao
        1s
        ease
        1.8s
        forwards;

}


/* =====================================================
   BOTÕES
===================================================== */

.botoes{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:20px;

    flex-wrap:wrap;

    margin-top:45px;

    opacity:0;

    animation:
        aparecerBotoes
        1s
        ease
        2.1s
        forwards;

}


.botao{

    min-width:230px;

    padding:18px 25px;

    border:1px solid #a855f7;

    border-radius:8px;

    background:
        rgba(25,5,40,.65);

    color:white;

    text-decoration:none;

    font-size:16px;

    line-height:1.5;

    box-shadow:
        0 0 15px
        rgba(168,85,247,.25);

    transition:

        transform .3s ease,

        background .3s ease,

        box-shadow .3s ease;

}


.botao:hover{

    transform:translateY(-5px);

    background:
        rgba(126,34,206,.5);

    box-shadow:

        0 0 30px
        rgba(168,85,247,.7);

}


.botao:active{

    transform:
        translateY(-2px)
        scale(.98);

}


/* =====================================================
   MÚSICA
===================================================== */

.musica{

    margin-top:35px;

    opacity:0;

    animation:
        aparecerDescricao
        1s
        ease
        2.4s
        forwards;

}


.musica button{

    border:1px solid #8b5cf6;

    border-radius:25px;

    padding:12px 24px;

    color:#ede9fe;

    background:
        rgba(10,3,18,.75);

    cursor:pointer;

    font-family:Georgia, serif;

    font-size:15px;

    transition:.3s;

}


.musica button:hover{

    background:
        rgba(91,33,182,.6);

    box-shadow:

        0 0 20px
        rgba(139,92,246,.5);

}


/* =====================================================
   RODAPÉ
===================================================== */

.rodape{

    margin-top:35px;

    font-size:12px;

    color:#8b8199;

    opacity:0;

    animation:
        aparecerDescricao
        1s
        ease
        2.7s
        forwards;

}


/* =====================================================
   RESPONSIVO
===================================================== */

@media(max-width:600px){

    .conteudo{

        width:95%;

        padding:25px 15px;

    }


    .titulo{

        letter-spacing:6px;

    }


    .subtitulo{

        font-size:14px;

        letter-spacing:4px;

    }


    .descricao{

        font-size:15px;

    }


    .botao{

        width:100%;

        max-width:300px;

    }

}

</style>

</head>


<body>


<main class="conteudo">


    <!-- =================================================
         TÍTULO
    ================================================== -->

    <h1 class="titulo">
        NEXUS
    </h1>


    <div class="subtitulo">
        AWAKENING
    </div>


    <div class="linha"></div>


    <!-- =================================================
         FRASE
    ================================================== -->

    <p class="descricao">

        “Nem toda sombra esconde algo.
        Algumas apenas revelam o que a luz não mostra.”

    </p>


    <!-- =================================================
         BOTÕES
    ================================================== -->

    <div class="botoes">


        <a
            href="livro.html"
            class="botao"
        >

            📖<br>

            Livro do RPG

        </a>


        <a
            href="ficha.html"
            class="botao"
        >

            📝<br>

            Ficha do Personagem

        </a>


    </div>


    <!-- =================================================
         MÚSICA
    ================================================== -->

    <div class="musica">

        <button
            id="botao-musica"
            onclick="alternarMusica()"
        >

            🎸 Tocar música

        </button>

    </div>


    <!-- =================================================
         RODAPÉ
    ================================================== -->

    <div class="rodape">

        NEXUS-AWAKENING • RPG

    </div>


</main>


<!-- =====================================================
     ÁUDIO
     
     COLOQUE O MP3 NA MESMA PASTA DO index.html.
     
     Nome:
     Dark Acoustic Guitar Instrumental Beat 2018
     Betrayed - Ryini Beats (youtube).mp3
===================================================== -->

<audio
    id="musica"
    preload="auto"
    loop
>

    <source
        src="Dark Acoustic Guitar Instrumental Beat 2018 Betrayed - Ryini Beats (youtube).mp3"
        type="audio/mpeg"
    >

</audio>


<script>

/* =====================================================
   MÚSICA
===================================================== */

const musica =
    document.getElementById("musica");


const botaoMusica =
    document.getElementById("botao-musica");


let tocando = false;


function alternarMusica(){

    if(!tocando){

        musica.volume = 0.45;


        const tentativa =
            musica.play();


        if(tentativa !== undefined){

            tentativa
                .then(function(){

                    tocando = true;

                    botaoMusica.innerHTML =
                        "🔊 Música ligada";

                })

                .catch(function(){

                    alert(
                        "Não foi possível iniciar a música. Verifique se o arquivo MP3 está na mesma pasta do index.html."
                    );

                });

        }

    }else{

        musica.pause();

        tocando = false;

        botaoMusica.innerHTML =
            "🎸 Tocar música";

    }

}

</script>


</body>

</html>
